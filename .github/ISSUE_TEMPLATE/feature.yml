name: Fitur
description: Fitur atau peningkatan baru
labels: ["type:feature"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [domain, gateway, catalog, avatar, bundle, ui, purchase, save, data, tooling, docs]
    validations: { required: true }
  - type: dropdown
    id: priority
    attributes:
      label: Prioritas
      options: [P0, P1, P2]
    validations: { required: true }
  - type: textarea
    id: goal
    attributes:
      label: Tujuan
      description: Apa yang pemain/dev dapatkan?
    validations: { required: true }
  - type: textarea
    id: done
    attributes:
      label: Selesai jika
      placeholder: "- [ ] ...\n- [ ] ..."
    validations: { required: true }